<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B3D91">
<title>Diário de Notas | Teste Firebase v2</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#17202a;display:flex;align-items:center;justify-content:center}.card{width:min(480px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 8px 28px #00000014}h1{margin:0 0 8px;color:#0B3D91;font-size:23px;text-align:center}.sub{text-align:center;color:#647282;line-height:1.5;font-size:14px;margin:0 0 20px}.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;border:1px solid #d4dce5;background:#f6f8fa;padding:11px;border-radius:9px;font-weight:700;color:#334155}.tabs button.active{background:#0B3D91;color:white}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}button.action{width:100%;;border:0;border-radius:9px;padding:13px;background:#0B3D91;color:white;font-size:15px;font-weight:700;margin-top:16px}.google{background:#fff!important;color:#243447!important;border:1px solid #cbd5e1!important}.sep{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:12px;margin:17px 0}.sep:before,.sep:after{content:'';height:1px;background:#e2e8f0;flex:1}.links{margin-top:14px}.links button{border:0;background:none;color:#1769aa;font-size:13px;padding:4px}.status{margin-top:16px;padding:11px;border-radius:9px;background:#f1f5f9;color:#334155;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.ok{background:#e8f5e9;color:#1b5e20}.err{background:#ffebee;color:#b71c1c}.hint{font-size:12px;color:#64748b;line-height:1.5;margin-top:18px}.hidden{display:none!important}button:disabled{opacity:.55}
</style></head><body><main class="card">
<h1>Diário de Notas do Professor</h1><p class="sub">Teste isolado do Firebase Authentication. Não acessa nem altera notas.</p>
<div id="authArea"><div class="tabs"><button id="loginTab" class="active" type="button">Entrar</button><button id="registerTab" type="button">Criar conta</button></div>
<form id="form"><div id="nameBox" class="hidden"><label for="name">Nome completo</label><input id="name" autocomplete="name"></div><div id="phoneBox" class="hidden"><label for="phone">Telefone com DDD</label><input id="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"></div>
<label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><div id="passwordBox"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6"></div><div id="confirmBox" class="hidden"><label for="confirm">Confirmar senha</label><input id="confirm" type="password" minlength="6" autocomplete="new-password"></div>
<button class="action" id="submit" type="submit">Entrar</button></form><div class="sep">ou</div><button class="action google" id="google" type="button">Continuar com Google</button><div class="links"><button id="forgot" type="button">Esqueci minha senha</button><button id="back" type="button" class="hidden">Voltar para entrar</button></div><p class="hint">Cadastro por e-mail exige confirmação por link. O telefone é apenas informativo, sem SMS.</p></div>
<div id="profile" class="hidden"><div id="profileText" class="status ok"></div><button id="logout" class="action google" type="button">Sair da conta</button></div>
<div id="status" class="status">Inicializando o SDK Firebase...</div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { initializeAuth, browserLocalPersistence, browserPopupRedirectResolver, GoogleAuthProvider, signInWithPopup, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, sendPasswordResetEmail, updateProfile, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

const firebaseConfig={apiKey:'AIzaSyDjmKNNXynwLo4lWr3-2I2nvaejELNaxUQ',authDomain:'diario-de-notas-do-profe-4085c.firebaseapp.com',projectId:'diario-de-notas-do-profe-4085c',storageBucket:'diario-de-notas-do-profe-4085c.firebasestorage.app',messagingSenderId:'839959456470',appId:'1:839959456470:web:3f766b3f2d7a7733957777'};
const $=id=>document.getElementById(id);let mode='login',auth;
function show(msg,type=''){const el=$('status');el.textContent=msg;el.className='status '+type;}
function niceError(e){const map={'auth/invalid-api-key':'O SDK recebeu uma chave de API inválida.','auth/api-key-not-valid':'O serviço recusou a chave de API enviada pelo SDK.','auth/unauthorized-domain':'O domínio desta página não está autorizado no Firebase.','auth/invalid-credential':'E-mail ou senha incorretos, ou credencial inexistente.','auth/email-already-in-use':'Este e-mail já possui uma conta.','auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.','auth/popup-closed-by-user':'A janela do Google foi fechada antes de concluir.','auth/popup-blocked':'O navegador bloqueou a janela do Google.','auth/account-exists-with-different-credential':'Este e-mail já está cadastrado por outro método. Será necessário vincular os provedores.'};return (e.code?e.code+' | ':'')+(map[e.code]||e.message||String(e));}
function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('registerTab').classList.toggle('active',m==='register');$('loginTab').classList.toggle('hidden',m==='reset');$('registerTab').classList.toggle('hidden',m==='reset');$('nameBox').classList.toggle('hidden',m!=='register');$('phoneBox').classList.toggle('hidden',m!=='register');$('confirmBox').classList.toggle('hidden',m!=='register');$('passwordBox').classList.toggle('hidden',m==='reset');$('password').required=m!=='reset';$('confirm').required=m==='register';$('forgot').classList.toggle('hidden',m!=='login');$('back').classList.toggle('hidden',m!=='reset');$('submit').textContent=m==='register'?'Criar minha conta':m==='reset'?'Enviar link de recuperação':'Entrar';show('Modo: '+m+'. SDK inicializado.');}
try{const app=initializeApp(firebaseConfig);auth=initializeAuth(app,{persistence:browserLocalPersistence,popupRedirectResolver:browserPopupRedirectResolver});show('SDK inicializado corretamente. Projeto: '+app.options.projectId+' | Chave configurada: '+app.options.apiKey.slice(0,10)+'…');}
catch(e){show('Falha ao inicializar o Firebase: '+niceError(e),'err');throw e;}
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('back').onclick=()=>setMode('login');
$('form').addEventListener('submit',async ev=>{ev.preventDefault();$('submit').disabled=true;try{const email=$('email').value.trim(),password=$('password').value;if(mode==='reset'){await sendPasswordResetEmail(auth,email);show('Link de recuperação enviado para '+email+'.','ok');return;}if(mode==='register'){const name=$('name').value.trim();if(!name)throw new Error('Informe seu nome completo.');if(password!==$('confirm').value)throw new Error('As senhas não conferem.');const cred=await createUserWithEmailAndPassword(auth,email,password);await updateProfile(cred.user,{displayName:name});await sendEmailVerification(cred.user);await signOut(auth);show('Conta criada. Confirme o e-mail pelo link enviado antes de entrar. Telefone informado: '+($('phone').value.trim()||'não informado')+'.','ok');return;}const cred=await signInWithEmailAndPassword(auth,email,password);if(!cred.user.emailVerified){await sendEmailVerification(cred.user);await signOut(auth);show('E-mail ainda não confirmado. Enviamos um novo link de confirmação.','err');return;}show('Login por e-mail realizado com sucesso.','ok');}catch(e){show(niceError(e),'err');}finally{$('submit').disabled=false;}});
$('google').onclick=async()=>{const b=$('google');b.disabled=true;try{const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const result=await signInWithPopup(auth,provider);show('Login Google realizado. UID: '+result.user.uid,'ok');}catch(e){show(niceError(e),'err');}finally{b.disabled=false;}};
$('forgot').onclick=()=>setMode('reset');$('logout').onclick=async()=>{try{await signOut(auth);show('Você saiu da conta.','ok');}catch(e){show(niceError(e),'err');}};
onAuthStateChanged(auth,user=>{if(user){$('authArea').classList.add('hidden');$('profile').classList.remove('hidden');$('profileText').textContent='Autenticado\nNome: '+(user.displayName||'não informado')+'\nE-mail: '+(user.email||'')+'\nUID: '+user.uid+'\nE-mail confirmado: '+(user.emailVerified?'Sim':'Não');}else{$('authArea').classList.remove('hidden');$('profile').classList.add('hidden');}},error=>show('Erro ao observar a sessão: '+niceError(error),'err'));
</script></body></html>
