<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <meta name="theme-color" content="#0B3D91">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Diário de Notas - Radiologia</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef1f5;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <!-- SISTEMA PRINCIPAL -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbwzCAi_TOYvbFV45xB8_8qixBI9wxKKR9aIhmjb0UsX6SCbqw7HW4gbyaha0_udnJNn/exec"
    allow="clipboard-read; clipboard-write; web-share"
    loading="eager">
  </iframe>

  <!--
    RECEBE O PDF GERADO PELO SISTEMA
    DENTRO DO GOOGLE APPS SCRIPT
  -->
  <script>
    window.addEventListener("message", function(event) {

      /*
       * Só aceita a mensagem enviada pelo
       * sistema do Google Apps Script.
       */
      if (!event.data ||
          event.data.type !== "DIARIO_PDF_PRONTO") {
        return;
      }

      /*
       * Segurança:
       * aceita somente mensagens vindas
       * dos domínios utilizados pelo Apps Script.
       */
      if (
        event.origin !== "https://script.google.com" &&
        event.origin !== "https://script.googleusercontent.com"
      ) {
        return;
      }

      const dataUri = event.data.dataUri;
      const filename =
        event.data.filename || "Diario_de_Notas.pdf";

      if (!dataUri) {
        alert("Não foi possível receber o PDF.");
        return;
      }

      /*
       * Cria o download do PDF.
       */
      try {

        const link = document.createElement("a");

        link.href = dataUri;
        link.download = filename;

        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);

      } catch (erro) {

        console.error(
          "Erro ao baixar PDF:",
          erro
        );

        /*
         * Fallback:
         * abre o PDF caso o navegador bloqueie
         * o download automático.
         */
        try {
          window.open(dataUri, "_blank");
        } catch (e) {
          alert(
            "O PDF foi gerado, mas o navegador bloqueou o download automático."
          );
        }
      }
    });
  </script>


  <!-- SERVICE WORKER / PWA -->
  <script>
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function() {

        navigator.serviceWorker
          .register("./service-worker.js")
          .catch(function(error) {

            console.log(
              "Service Worker:",
              error
            );

          });

      });

    }
  </script>

</body>
</html>
