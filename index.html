<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Diário de Notas - Radiologia</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #eef1f5;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <!-- SISTEMA PRINCIPAL -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbwzCAi_TOYvbFV45xB8_8qixBI9wxKKR9aIhmjb0UsX6SCbqw7HW4gbyaha0_udnJNn/exec"
    allow="clipboard-read; clipboard-write; web-share"
    loading="eager">
  </iframe>


  <!--
    RECEBE O PDF GERADO PELO SISTEMA
    DENTRO DO GOOGLE APPS SCRIPT
  -->
  <script>
    window.addEventListener("message", function(event) {

      /*
       * Só aceita a mensagem enviada pelo
       * sistema do Google Apps Script.
       */
      if (
        !event.data ||
        event.data.type !== "DIARIO_PDF_PRONTO"
      ) {
        return;
      }

      /*
       * Aqui podemos receber futuramente
       * informações do PDF gerado pelo sistema.
       */
      console.log("PDF recebido:", event.data);

    });
  </script>

</body>
</html>
