<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B3D91">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Diário de Notas do Professor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef1f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    #carregando {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef1f5;
      color: #0B3D91;
      text-align: center;
      padding: 24px;
    }
    .box {
      max-width: 360px;
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 8px 28px rgba(0,0,0,.12);
    }
    .logo {
      width: 74px;
      height: 74px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    p {
      color: #687482;
      font-size: 14px;
      line-height: 1.45;
      margin: 0;
    }
    .spinner {
      width: 28px;
      height: 28px;
      margin: 18px auto 0;
      border: 3px solid #dbe5f2;
      border-top-color: #0B3D91;
      border-radius: 50%;
      animation: giro .8s linear infinite;
    }
    @keyframes giro { to { transform: rotate(360deg); } }
    #app {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      visibility: hidden;
      background: #eef1f5;
    }
    #fallback {
      display: none;
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 5px 22px rgba(0,0,0,.18);
      font-size: 13px;
      color: #44515e;
    }
    #fallback a {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 12px;
      border-radius: 8px;
      background: #0B3D91;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="carregando">
    <div class="box">
      <img class="logo" src="./icon-192.png" alt="Diário de Notas">
      <h1>Diário de Notas do Professor</h1>
      <p>Carregando seu diário...</p>
      <div class="spinner"></div>
    </div>
  </div>

  <iframe
    id="app"
    title="Diário de Notas do Professor"
    src="https://script.google.com/macros/s/AKfycbwzCAi_TOYvbFV45xB8_8qixBI9wxKKR9aIhmjb0UsX6SCbqw7HW4gbyaha0_udnJNn/exec"
    allow="storage-access; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
    loading="eager">
  </iframe>

  <div id="fallback">
    Se o diário não carregar, toque abaixo para abrir a versão direta.
    <br>
    <a href="https://script.google.com/macros/s/AKfycbwzCAi_TOYvbFV45xB8_8qixBI9wxKKR9aIhmjb0UsX6SCbqw7HW4gbyaha0_udnJNn/exec">Abrir Diário de Notas</a>
  </div>

  <script>
    const iframe = document.getElementById('app');
    const carregando = document.getElementById('carregando');
    const fallback = document.getElementById('fallback');

    iframe.addEventListener('load', function () {
      carregando.style.display = 'none';
      iframe.style.visibility = 'visible';
    });

    // Apenas como plano B. Não altera o funcionamento do aplicativo.
    setTimeout(function () {
      fallback.style.display = 'block';
    }, 12000);
  </script>
</body>
</html>
