<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B3D91">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Diário de Notas do Professor</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #eef1f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #17202a;
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 22px;
      padding: 32px 24px 26px;
      text-align: center;
      box-shadow: 0 10px 32px rgba(0,0,0,.12);
    }
    .logo {
      width: 96px;
      height: 96px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 10px;
      color: #0B3D91;
      font-size: 23px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 22px;
      color: #65717d;
      font-size: 14px;
      line-height: 1.5;
    }
    .entrar {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border-radius: 12px;
      background: #0B3D91;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 5px 14px rgba(11,61,145,.22);
    }
    .entrar:active { transform: scale(.99); }
    .info {
      margin-top: 16px;
      font-size: 12px;
      color: #89939d;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./icon-192.png" alt="Diário de Notas do Professor">
    <h1>Diário de Notas do Professor</h1>
    <p>Acesse seu diário de notas de forma segura e simples.</p>

    <a class="entrar" href="https://script.google.com/macros/s/AKfycbwzCAi_TOYvbFV45xB8_8qixBI9wxKKR9aIhmjb0UsX6SCbqw7HW4gbyaha0_udnJNn/exec" target="_self">
      ENTRAR NO DIÁRIO DE NOTAS
    </a>

    <div class="info">
      Ao tocar em entrar, o sistema será aberto no navegador e utilizará sua conta Google.
    </div>
  </main>
</body>
</html>
