<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>Diário de Notas - Radiologia</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #eef1f5;
      font-family: Arial, sans-serif;
    }

    /* Área do aplicativo */
    #areaApp {
      width: 100%;
      height: 100%;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* ==========================================
       MODAL DE OPÇÕES DO PDF
       ========================================== */

    #modalPDFApp {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #modalPDFApp .modal-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-sizing: border-box;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    #modalPDFApp h2 {
      margin: 0 0 10px 0;
      font-size: 22px;
      color: #222;
    }

    #modalPDFApp p {
      margin: 0 0 20px 0;
      color: #666;
      font-size: 15px;
      line-height: 1.4;
    }

    #modalPDFApp button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #btnCompartilharPDFApp {
      background: #0B3D91;
      color: white;
    }

    #btnBaixarPDFAapp {
      background: #18864b;
      color: white;
    }

    #btnCancelarPDFApp {
      background: #eeeeee;
      color: #333;
    }

  </style>
</head>

<body>

  <!-- ==========================================
       APLICATIVO PRINCIPAL
       ========================================== -->

  <div id="areaApp">
    <iframe
      src="https://script.google.com/macros/s/AKfycbwzCAi_TOYvbFV45xB8_8qixBI9wxKKR9aIhmjb0UsX6SCbqw7HW4gbyaha0_udnJNn/exec"
      allow="clipboard-read; clipboard-write; web-share"
      loading="eager">
    </iframe>
  </div>


  <!-- ==========================================
       MODAL DE PDF
       ========================================== -->

  <div id="modalPDFApp">

    <div class="modal-box">

      <h2>📄 PDF gerado com sucesso</h2>

      <p>
        O Diário de Notas foi gerado.
        Escolha o que deseja fazer:
      </p>

      <button
        id="btnCompartilharPDFApp"
        onclick="compartilharPDFAplicativo()">
        📤 Compartilhar PDF
      </button>

      <button
        id="btnBaixarPDFAapp"
        onclick="baixarPDFAplicativo()">
        📥 Baixar PDF
      </button>

      <button
        id="btnCancelarPDFApp"
        onclick="fecharModalPDFAplicativo()">
        ❌ Cancelar
      </button>

    </div>

  </div>


  <!-- ==========================================
       JAVASCRIPT DO APLICATIVO
       ========================================== -->

  <script>

    let pdfRecebidoApp = null;
    let nomePdfRecebidoApp = "Diario_de_Notas.pdf";


    /*
     * Recebe o PDF enviado pelo Google Apps Script.
     */
    window.addEventListener("message", function(event) {

      const dados = event.data;

      if (!dados) return;

      /* PDF enviado pelo Google Apps Script */
      if (dados.type === "DIARIO_PDF_PRONTO") {

        try {
          let blob = dados.blob || null;

          /* Versão robusta: recebe Data URI/Base64 */
          if (!blob && dados.dataUri) {
            const partes = String(dados.dataUri).split(',');
            const base64 = partes[1] || '';
            const bin = atob(base64);
            const bytes = new Uint8Array(bin.length);

            for (let i = 0; i < bin.length; i++) {
              bytes[i] = bin.charCodeAt(i);
            }

            blob = new Blob([bytes], { type: 'application/pdf' });
          }

          if (!blob) {
            alert('Não foi possível receber o PDF. Gere novamente.');
            return;
          }

          pdfRecebidoApp = blob;
          nomePdfRecebidoApp = dados.filename || 'Diario_de_Notas.pdf';

          document.getElementById("modalPDFApp").style.display = "flex";

        } catch (erro) {
          console.error('Erro ao receber PDF:', erro);
          alert('Erro ao receber o PDF. Tente novamente.');
        }

        return;
      }

      /* Backup enviado pelo Google Apps Script */
      if (dados.type === "DIARIO_BACKUP_PRONTO") {

        try {
          const conteudo = dados.conteudo || '';
          if (!conteudo) {
            alert('Não foi possível receber o backup.');
            return;
          }

          const blob = new Blob(
            [conteudo],
            { type: 'application/json;charset=utf-8' }
          );

          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = dados.filename || 'backup_diario_notas.json';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(function() {
            URL.revokeObjectURL(url);
          }, 1000);

        } catch (erro) {
          console.error('Erro ao baixar backup:', erro);
          alert('Não foi possível baixar o backup.');
        }

      }

    });


    /*
     * Fecha o modal.
     */
    function fecharModalPDFAplicativo() {

      document.getElementById("modalPDFApp").style.display = "none";

      pdfRecebidoApp = null;

      nomePdfRecebidoApp = "Diario_de_Notas.pdf";
    }


    /*
     * Compartilha o PDF pelo compartilhamento nativo
     * do Android/Samsung.
     */
    async function compartilharPDFAplicativo() {

      if (!pdfRecebidoApp) {

        alert(
          "O PDF não está disponível. " +
          "Gere o PDF novamente."
        );

        return;
      }

      const arquivo = new File(
        [pdfRecebidoApp],
        nomePdfRecebidoApp,
        {
          type: "application/pdf"
        }
      );

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare({
          files: [arquivo]
        })
      ) {

        try {

          await navigator.share({
            files: [arquivo],
            title: "Diário de Notas",
            text: "Diário de Notas"
          });

          fecharModalPDFAplicativo();

        } catch (erro) {

          if (
            erro &&
            erro.name === "AbortError"
          ) {
            return;
          }

          alert(
            "Não foi possível compartilhar o PDF. " +
            "Você pode utilizar a opção " +
            "\"Baixar PDF\"."
          );
        }

      } else {

        alert(
          "O compartilhamento direto de arquivos " +
          "não está disponível neste dispositivo. " +
          "Use \"Baixar PDF\" e depois compartilhe o arquivo."
        );
      }
    }


    /*
     * Faz o download do PDF.
     */
    function baixarPDFAplicativo() {

      if (!pdfRecebidoApp) {

        alert(
          "O PDF não está disponível. " +
          "Gere o PDF novamente."
        );

        return;
      }

      const url = URL.createObjectURL(
        pdfRecebidoApp
      );

      const link =
        document.createElement("a");

      link.href = url;

      link.download =
        nomePdfRecebidoApp ||
        "Diario_de_Notas.pdf";

      document.body.appendChild(link);

      link.click();

      document.body.removeChild(link);

      setTimeout(function() {
        URL.revokeObjectURL(url);
      }, 1000);

      fecharModalPDFAplicativo();
    }

  </script>


  <!-- ==========================================
       SERVICE WORKER
       ========================================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function() {

        navigator.serviceWorker
          .register("./service-worker.js")
          .catch(function(error) {

            console.log(
              "Service Worker:",
              error
            );

          });

      });

    }

  </script>

</body>
</html>
