<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0B3D91">
  <title>Diário de Notas do Professor</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #eef1f5; font-family: Arial, sans-serif; color: #17202a; margin: 0; }
    .card { width: min(460px, 100%); background: #fff; border-radius: 22px; padding: 32px 26px 28px; text-align: center; box-shadow: 0 10px 32px rgba(0,0,0,.12); }
    .logo { width: 96px; height: 96px; object-fit: contain; margin-bottom: 10px; }
    h1 { margin: 0 0 12px; color: #0B3D91; font-size: 24px; }
    .subtitulo { margin: 0 0 18px; color: #3f4b57; font-size: 15px; font-weight: 600; }
    .descricao { margin: 0 0 24px; color: #65717d; font-size: 14px; }
    #googleLogin { display: flex; justify-content: center; min-height: 44px; margin-top: 4px; }
    #statusLogin { margin-top: 12px; font-size: 12px; color: #65717d; }
    .info { margin-top: 16px; font-size: 12px; color: #89939d; }
    .rodape { margin-top: 22px; padding-top: 16px; border-top: 1px solid #e5e8eb; font-size: 11px; color: #9aa3ab; }
    #areaDiario { display: none; position: fixed; inset: 0; width: 100%; height: 100%; background: #eef1f5; z-index: 9999; }
    #diarioFrame { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <main class="card" id="telaInicial">
    <img class="logo" src="./icon-192.png" alt="Logo">
    <h1>Diário de Notas do Professor</h1>
    <p class="subtitulo">Sistema para gerenciamento acadêmico</p>
    <p class="descricao">Organize turmas, disciplinas e alunos, registre notas e acompanhe o aproveitamento acadêmico.</p>
    <div id="googleLogin"></div>
    <div id="statusLogin"></div>
    <div class="info">Entre com sua conta Google para continuar.</div>
    <div class="rodape">Diário de Notas do Professor</div>
  </main>

  <div id="areaDiario">
    <iframe id="diarioFrame" title="Diário de Notas" allow="clipboard-read; clipboard-write"></iframe>
  </div>

  <script>
    const GOOGLE_CLIENT_ID = '1073009990150-bb3bic5e039aasipe0d015osuh92omtg.apps.googleusercontent.com';

    function abrirDiario(emailUsuario) {
      if (emailUsuario) localStorage.setItem('diario_email_ativo', emailUsuario);
      // Substitua abaixo pela sua URL correta do Web App do Google Apps Script
      const urlDiario = 'https://script.google.com/macros/s/AKfycbzv0ZqXlNlAft-cDq3pA-6CGTDwKt0dqdE2DdzaCaLV2ji769b_SGguMd_f5taS_SHG/exec';
      document.getElementById('diarioFrame').src = urlDiario;
      document.getElementById('telaInicial').style.display = 'none';
      document.getElementById('areaDiario').style.display = 'block';
    }

    function handleGoogleCredential(response) {
      if (response && response.credential) {
        try {
          const base64Url = response.credential.split('.')[1];
          const payload = JSON.parse(decodeURIComponent(atob(base64Url.replace(/-/g, '+').replace(/_/g, '/')).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
          if (payload && payload.email) {
            abrirDiario(payload.email);
            return;
          }
        } catch (e) {}
        abrirDiario('conta-google');
      }
    }

    window.addEventListener('load', function () {
      const emailSalvo = localStorage.getItem('diario_email_ativo');
      if (emailSalvo) {
        abrirDiario(emailSalvo);
        return;
      }
      google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential, ux_mode: 'popup' });
      google.accounts.id.renderButton(document.getElementById('googleLogin'), { type: 'standard', theme: 'outline', size: 'large', width: 360 });
    });
  </script>
</body>
</html>
