<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <meta name="theme-color" content="#0B3D91">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>Diário de Notas - Radiologia</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef1f5;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwzCAi_TOYvbFV45xB8_8qixBI9wxKKR9aIhmjb0UsX6SCbqw7HW4gbyaha0_udnJNn/exec"
    allow="clipboard-read; clipboard-write; web-share"
    loading="eager">
  </iframe>


  <!-- =====================================================
       RECEBE PDF E BACKUP GERADOS PELO GOOGLE APPS SCRIPT
       ===================================================== -->
  <script>

    window.addEventListener("message", function(event) {

      const dados = event.data;

      if (!dados || !dados.type) {
        return;
      }


      /* ===================================================
         PDF
         =================================================== */

      if (dados.type === "DIARIO_PDF_PRONTO") {

        try {

          if (!dados.dataUrl) {
            alert("O PDF foi gerado, mas o arquivo não foi recebido.");
            return;
          }

          const link = document.createElement("a");

          link.href = dados.dataUrl;

          link.download =
            dados.filename || "Diario_de_Notas.pdf";

          document.body.appendChild(link);

          link.click();

          document.body.removeChild(link);

        } catch (erro) {

          console.error("Erro ao baixar PDF:", erro);

          alert(
            "O PDF foi gerado, mas ocorreu um erro ao iniciar o download."
          );
        }

        return;
      }


      /* ===================================================
         BACKUP
         =================================================== */

      if (dados.type === "DIARIO_BACKUP_PRONTO") {

        try {

          if (!dados.conteudo) {
            alert("O backup foi gerado, mas o arquivo não foi recebido.");
            return;
          }

          const blob = new Blob(
            [dados.conteudo],
            {
              type: "application/json;charset=utf-8"
            }
          );

          const url = URL.createObjectURL(blob);

          const link = document.createElement("a");

          link.href = url;

          link.download =
            dados.filename || "backup_diario_notas.json";

          document.body.appendChild(link);

          link.click();

          document.body.removeChild(link);

          setTimeout(function() {
            URL.revokeObjectURL(url);
          }, 1000);

        } catch (erro) {

          console.error("Erro ao baixar backup:", erro);

          alert(
            "O backup foi gerado, mas ocorreu um erro ao iniciar o download."
          );
        }

        return;
      }

    });


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function() {

        navigator.serviceWorker
          .register("./service-worker.js")
          .catch(function(error) {

            console.log(
              "Service Worker:",
              error
            );

          });

      });

    }

  </script>

</body>
</html>
