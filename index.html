<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0B3D91">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Diário de Notas do Professor</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef1f5;
    }
    .app-frame {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #eef1f5;
    }
    /*
      O Apps Script exibe uma faixa própria no topo quando o Web App
      é acessado por uma conta diferente da conta publicadora.
      O aplicativo continua sendo carregado dentro do iframe; aqui
      apenas recortamos visualmente essa faixa, sem alterar o Apps Script.
    */
    iframe {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app-frame">
    <iframe
      src="https://script.google.com/macros/s/AKfycbwzCAi_TOYvbFV45xB8_8qixBI9wxKKR9aIhmjb0UsX6SCbqw7HW4gbyaha0_udnJNn/exec?embedded=true"
      allow="clipboard-read; clipboard-write; web-share"
      loading="eager"
      title="Diário de Notas do Professor">
    </iframe>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.log("Service Worker:", error));
      });
    }
  </script>
</body>
</html>
