<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Firebase | Diário</title>
<style>body{font-family:Arial,sans-serif;background:#eef1f5;margin:0;padding:24px;color:#17202a}.card{max-width:560px;margin:30px auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 28px #0001}h1{color:#0b3d91;font-size:22px}button{padding:12px 16px;border:0;border-radius:9px;background:#0b3d91;color:white;font-weight:bold;margin:6px 4px 6px 0}button:disabled{opacity:.5}#status{white-space:pre-wrap;background:#f3f6f9;padding:14px;border-radius:10px;line-height:1.5;margin-top:14px}.muted{color:#667}</style></head>
<body><main class="card"><h1>Diário de Notas do Professor</h1><p>Teste isolado de conexão com o Firestore. Este teste não acessa nem altera suas notas.</p><p id="user">Aguardando autenticação.</p><button id="google">Entrar com Google</button><button id="test" disabled>Testar gravação e leitura</button><button id="out" disabled>Sair</button><div id="status">Inicializando Firebase...</div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {initializeAuth,browserLocalPersistence,browserPopupRedirectResolver,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const config={apiKey:'AIzaSyDjmKNNXynwLo4lWr3-2I2nvaejELNaxUQ',authDomain:'diario-de-notas-do-profe-4085c.firebaseapp.com',projectId:'diario-de-notas-do-profe-4085c',storageBucket:'diario-de-notas-do-profe-4085c.firebasestorage.app',messagingSenderId:'839959456470',appId:'1:839959456470:web:3f766b3f2d7a7733957777'};
const app=initializeApp(config);const auth=initializeAuth(app,{persistence:browserLocalPersistence,popupRedirectResolver:browserPopupRedirectResolver});const db=getFirestore(app);const provider=new GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});
const $=id=>document.getElementById(id);let user=null;function status(s){$('status').textContent=s}
onAuthStateChanged(auth,u=>{user=u;$('user').textContent=u?`Conectado: ${u.displayName||''}\n${u.email}\nUID: ${u.uid}`:'Não autenticado.';$('google').disabled=!!u;$('test').disabled=!u;$('out').disabled=!u;});
$('google').onclick=async()=>{try{status('Abrindo autenticação Google...');await signInWithPopup(auth,provider);status('Autenticação concluída. Agora teste o Firestore.')}catch(e){status(`Falha no login: ${e.code||''}\n${e.message||e}`)}};
$('test').onclick=async()=>{if(!user)return;const ref=doc(db,'usuarios',user.uid,'testes','conexao');const payload={tipo:'teste-conexao',uid:user.uid,email:user.email||'',criadoEm:serverTimestamp(),marcador:'DIARIO_FIRESTORE_OK'};try{status('Gravando documento de teste...');await setDoc(ref,payload);status('Gravação concluída. Lendo o mesmo documento...');const snap=await getDoc(ref);if(!snap.exists())throw new Error('O documento não foi encontrado após a gravação.');const d=snap.data();if(d.uid!==user.uid||d.marcador!=='DIARIO_FIRESTORE_OK')throw new Error('Os dados lidos não correspondem ao teste.');await deleteDoc(ref);status('SUCESSO! O Firestore gravou, leu e apagou o documento de teste. Nenhuma nota foi alterada.\n\nUID: '+user.uid+'\nE-mail: '+(user.email||''));}catch(e){status(`Falha no Firestore: ${e.code||''}\n${e.message||e}\n\nConfira se as regras de segurança foram publicadas.`)}};
$('out').onclick=async()=>{try{await signOut(auth);status('Você saiu da conta.')}catch(e){status(e.message||String(e))}};
status('SDK carregado. Entre com Google para continuar.');
</script></body></html>
