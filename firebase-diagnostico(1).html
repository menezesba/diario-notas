<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Firebase</title>
<style>body{font-family:Arial,sans-serif;background:#eef1f5;margin:0;padding:24px;color:#17202a}.box{max-width:620px;margin:8vh auto;background:white;padding:24px;border-radius:14px;box-shadow:0 5px 24px #0001}h2{color:#123f91}button{background:#123f91;color:white;border:0;border-radius:8px;padding:13px 18px;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f5f8;padding:14px;border-radius:8px;font-size:13px}.muted{color:#586575;font-size:14px}</style></head>
<body><main class="box"><h2>Diagnóstico de conexão Firebase</h2><p class="muted">Este teste verifica a chave e a resposta do serviço de autenticação. Não cria conta, não faz login e não grava notas.</p><button id="run">Executar diagnóstico</button><h3>Resultado</h3><pre id="out">Aguardando execução.</pre></main>
<script type="module">
const apiKey='AIzaSyDjmKNNXynwLo4lWr3-2I2nvaejELNaxUQ';
const out=document.querySelector('#out');
document.querySelector('#run').addEventListener('click',async()=>{
 out.textContent='Consultando o serviço oficial de autenticação...';
 try{
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${encodeURIComponent(apiKey)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:'diagnostico-sem-cadastro@example.invalid',continueUri:location.origin,returnIdpCredential:true})});
  const data=await r.json();
  if(r.ok){out.textContent='SUCESSO: a chave foi aceita pelo Firebase Authentication.\n\nResposta técnica:\n'+JSON.stringify(data,null,2)+'\n\nIsso indica que a chave e o endpoint de autenticação estão respondendo. O erro da página de login deverá ser investigado na inicialização/versão do SDK ou no código publicado.';}
  else{out.textContent='O Firebase recusou a solicitação. HTTP '+r.status+'\n\nResposta técnica:\n'+JSON.stringify(data,null,2)+'\n\nEnvie esta tela. Não é necessário compartilhar senha.';}
 }catch(e){out.textContent='Não foi possível concluir a consulta.\n'+String(e)+'\n\nPode ser bloqueio de rede, navegador ou CORS. Envie esta tela.';}
});
</script></body></html>
